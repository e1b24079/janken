<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Wait</title>
  <script>
    window.onload = function () {
      var sse = new EventSource('/result');
      sse.onmessage = function (event) {
        console.log("sse.onmessage")
        console.log(event.data);
        var match = JSON.parse(event.data);//JSONオブジェクトとしてparse
        // 試合結果と[もどる]リンクのhtmlを作成し，idがresultのdivの中身を差し替える
        var result = "<h2>結果</h2>"
          + "<p>Match: id " + match.id + " user1: " + match.user1 + " user2: " + match.user2
          + " user1Hand: " + match.user1Hand + " user2Hand: " + match.user2Hand + "</p>"
          + "<a href='/janken'>もどる</a>";
        document.getElementById("result").innerHTML = result;
        // 結果を表示したら接続を閉じる(閉じないと自動で再接続される)
        sse.close();
      }
    }
  </script>
</head>

<body>
  <h1>相手の手を待ってます</h1>
  <p>Hi [[${loginUser}]]</p>
  <div id="result"></div>
</body>

</html>
