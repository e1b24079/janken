<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>じゃんけん</title>
</head>

<body>
  <h1>じゃんけん</h1>
  <p>ログインユーザ：<span th:text="${loginUser}"></span>
    <a href="/logout">ログアウト</a>
  </p>

  <h2>エントリー</h2>
  <ul>
        <li th:each="user : ${users}"><a th:href="@{/match(id=${user.id})}">[[${user.name}]]</a></li>
  </ul>
  <h2>試合結果</h2>
  <p th:each="m : ${matches}">
    id:[[${m.id}]] user1:[[${m.user1}]] user2:[[${m.user2}]] user1の手:[[${m.user1Hand}]] user2の手:[[${m.user2Hand}]]
  </p>

  <!-- POSTで名前を送る -->
  <form action="/janken" method="post">
    名前：<input type="text" name="name">
    <input type="submit" value="送信">
  </form>
  <p th:if="${name}">こんにちは <span th:text="${name}"></span> さん</p>

  <!-- GETで手を送る -->
  <h2>手を選んでください</h2>
  <a href="/janken/game?hand=Gu">グー</a>
  <a href="/janken/game?hand=Choki">チョキ</a>
  <a href="/janken/game?hand=Pa">パー</a>

  <!-- Thymeleafで結果を表示 -->
  <div th:if="${result}">
    <p>あなたの手：<span th:text="${myHand}"></span></p>
    <p>相手の手：<span th:text="${cpuHand}"></span></p>
    <p th:text="${result}"></p>
  </div>
</body>

</html>
